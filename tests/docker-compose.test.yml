version: '3.8'

services:
  # Playwright E2E 自动化测试执行器
  materials-e2e-runner:
    build:
      context: ./meta4a-test-003-frontend-e2e
      dockerfile: Dockerfile
    container_name: materials-e2e-runner
    environment:
      # 指向宿主机本地运行的 Vite 端口
      - TARGET_WEB_URL=http://host.docker.internal:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./screenshots:/screenshots
