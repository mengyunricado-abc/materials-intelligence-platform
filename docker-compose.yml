version: "3.8"

services:
  evolution-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: materials-intelligence-evolution-app
    # 在容器内仅拉起 FastAPI 接口服务。自进化与回归测试的调度将完全在宿主机端运行以激活 Reactive Wakeup 强唤醒
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8085
    volumes:
      # 将宿主机工作区挂载进容器内部的 /app
      # 从而使容器内的自进化修改（影子合并后）能够实时、永久且无损地物理化落库在宿主机上
      - .:/app
      # 排除容器内的 Python 虚拟环境，以隔离依赖和编译驱动
      - /app/.venv
    ports:
      # 将容器内的 8085 端口映射到宿主机的 8090 端口，完全避开 8089 端口占用冲突
      - "8090:8085"
    environment:
      - PORT=8085
      - PYTHONUNBUFFERED=1
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
